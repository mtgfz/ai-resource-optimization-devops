# Optional local safety net: checks run before each `git commit`.
# Setup (once):  pip install pre-commit ruff pytest requests numpy httpx fastapi prometheus-client && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: ruff check app optimizer experiments
        language: system
        pass_filenames: false
      - id: pytest
        name: unit tests
        entry: pytest app/tests optimizer/tests -q
        language: system
        pass_filenames: false
